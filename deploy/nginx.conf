server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A 5,000-row paste is a few MB of JSON (the API accepts up to 20 MB).
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: forwarded to the api container on the internal Docker network.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built JS/CSS have content hashes in their names, so browsers can cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The app itself: always revalidate index.html so a new deploy shows up on reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
